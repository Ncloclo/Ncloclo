# Animation du rejeu publiée sur GitHub Pages et régénérée chaque nuit.
# Activation unique : Settings ▸ Pages ▸ Build and deployment ▸ Source :
# « GitHub Actions ». Adresse : https://ncloclo.github.io/Ncloclo/
# Données publiques Binance uniquement : aucune clé, aucun ordre, aucune
# base du bot (la section « portefeuille paper » n'apparaît pas).
name: Animation du rejeu (GitHub Pages)

on:
  schedule:
    - cron: "30 0 * * *"        # chaque jour à 00:30 UTC, après la clôture journalière
  workflow_dispatch:
  push:
    branches: [claude/v29-5-hybrid-bot-fz9gvm]
    paths:
      - replay_animation.py
      - templates/**
      - trendguard_bot.py
      - trend_strategy.py
      - diagnostics.py
      - v29.py
      - requirements-docker.txt
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - run: pip install -r requirements-docker.txt
      - name: Rejeu du bot sur les prix réels Binance
        run: |
          mkdir -p site
          python replay_animation.py --no-open --out site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
