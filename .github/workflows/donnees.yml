# Données de la revue hebdomadaire (agent Claude Code du lundi, 02:00 UTC).
# L'environnement cloud de l'agent n'a pas accès à Binance ni aux sites
# d'actualités ; GitHub Actions, si. Chaque lundi à 00:40 UTC, ce workflow
# produit la veille, le diagnostic, le laboratoire des stratégies et
# l'historique Binance, puis les publie sur la branche « donnees » (un seul
# commit, remplacé chaque semaine), que l'agent lit avec git.
# Lecture seule : aucune clé, aucun ordre.
name: Données de la revue hebdomadaire

on:
  schedule:
    - cron: "40 0 * * 1"        # lundi 00:40 UTC, avant la revue de 02:00
  workflow_dispatch:
  push:
    branches: [claude/v29-5-hybrid-bot-fz9gvm]
    paths: [.github/workflows/donnees.yml]

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - run: pip install -r requirements-docker.txt
      - name: Veille, diagnostic et laboratoire (données publiques Binance)
        env:
          # Réglage du .env du bot de Clovis (profil prudent) : le diagnostic
          # porte sur la configuration réellement utilisée. À aligner si le
          # .env change ; le laboratoire compare, lui, les règles de base.
          TG_DD_THROTTLE: "0.10:0.5"
        run: |
          mkdir -p out
          date -u +%Y-%m-%dT%H:%M:%SZ > out/DATE
          python trendguard_bot.py watch --no-ai --db /tmp/veille.db > out/veille.txt 2>&1 \
            || echo "(veille interrompue, voir ci-dessus)" >> out/veille.txt
          RUN_MODE=paper python trendguard_bot.py diagnose --out out/diagnostic.txt \
            > out/diagnostic.log 2>&1 || true
          python trendguard_bot.py lab --cache out/data_binance --out out/STRATEGIES.md \
            > out/laboratoire.log 2>&1 || true
          python -m research.selection --cache out/data_binance --out out/SELECTION.md \
            > out/selection.log 2>&1 || true
          cat > out/LISEZMOI.md <<'EOF'
          # Données de la revue hebdomadaire TrendGuard

          Produites chaque lundi à 00:40 UTC par `.github/workflows/donnees.yml`
          (date exacte dans `DATE`) et lues par l'agent Claude Code de 02:00.

          - `veille.txt` : annonces officielles Binance, actualités, Fear & Greed.
          - `diagnostic.txt` : `trendguard_bot.py diagnose` (données publiques).
          - `STRATEGIES.md` : laboratoire des stratégies (`trendguard_bot.py lab`).
          - `SELECTION.md` : auto-sélection des 10 plus rentables et prises de
            bénéfice fixes contre la référence (`python -m research.selection`), à
            comparer à `docs/SELECTION.md` : le réglage par défaut (21
            cryptos, gain laissé courir) ne change que si une variante gagne
            sur les deux périodes.
          - `data_binance/` : historique Binance, à passer en `--cache` pour
            tester des variantes sans réseau.
          - `*.log` : sorties complètes, en cas d'échec.
          EOF
          ls -la out
      - name: Publication sur la branche « donnees »
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b donnees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Données de la revue du $(cut -c1-10 DATE)"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" donnees
